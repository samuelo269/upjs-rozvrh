<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="metaTheme" content="#f8fafc">
<meta name="description" content="Týždenný rozvrh hodín – prehľad prednášok, cvičení a seminárov.">
<title>Rozvrh hodín</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%233b82f6'/%3E%3Crect%20x='6'%20y='8'%20width='20'%20height='18'%20rx='3'%20fill='%23ffffff'/%3E%3Crect%20x='6'%20y='8'%20width='20'%20height='5.5'%20rx='2.5'%20fill='%231d4ed8'/%3E%3Crect%20x='9'%20y='16.5'%20width='6'%20height='6'%20rx='2'%20fill='%233b82f6'/%3E%3Crect%20x='17'%20y='16.5'%20width='6'%20height='6'%20rx='2'%20fill='%23bfdbfe'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" role="img" aria-label="Rozvrh hodín">
        <rect width="32" height="32" rx="7" fill="#3b82f6"/>
        <rect x="6" y="8" width="20" height="18" rx="3" fill="#fff"/>
        <rect x="6" y="8" width="20" height="5.5" rx="2.5" fill="#1d4ed8"/>
        <rect x="9" y="16.5" width="6" height="6" rx="2" fill="#3b82f6"/>
        <rect x="17" y="16.5" width="6" height="6" rx="2" fill="#bfdbfe"/>
      </svg>
      <div>
        <h1>Rozvrh hodín</h1>
        <div class="sub"><span class="sem" id="semLabel"></span><span id="rangeLabel"></span></div>
      </div>
    </div>
    <button class="btn" type="button" id="themeBtn" aria-label="Prepnúť tému">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><span>Téma</span>
    </button>
  </header>

  <div class="banner" id="banner" aria-live="polite"></div>

  <div class="legend">
    <div class="lg">
      <span class="lt"><span class="pill P">P</span>Prednáška</span>
      <span class="lt"><span class="pill C">C</span>Cvičenie / Prax</span>
      <span class="lt"><span class="pill S">S</span>Seminár</span>
      <span class="lt"><span class="pill O">OPT</span>Možnosť / voľba</span>
    </div>
    <div class="hint">Klikni na predmet pre detaily<span class="hint-keys"> · šípky ← → prepínajú dni</span></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="card">
    <div class="grid" id="grid"></div>
  </div>

  <div class="agenda" id="agenda"></div>

  <noscript>Na zobrazenie rozvrhu je potrebný JavaScript.</noscript>
</div>

<div class="ovl" id="ovl" role="dialog" aria-modal="true" aria-labelledby="mName">
  <div class="mc">
    <button class="mx" type="button" id="closeBtn" aria-label="Zavrieť">&times;</button>
    <div class="code" id="mCode" style="color:var(--text-muted);margin-bottom:.25rem"></div>
    <div class="mt" id="mName"></div>
    <div class="mr"><span class="ml">Deň</span><span class="mv" id="mDay"></span></div>
    <div class="mr"><span class="ml">Čas</span><span class="mv" id="mTime"></span></div>
    <div class="mr"><span class="ml">Trvanie</span><span class="mv" id="mDur"></span></div>
    <div class="mr"><span class="ml">Miestnosť</span><span class="mv" id="mRoom"></span></div>
    <div class="mr"><span class="ml">Vyučujúci</span><span class="mv" id="mWho"></span></div>
    <div class="mr"><span class="ml">Typ</span><span class="mv" id="mType"></span></div>
    <div class="mr" id="mNoteRow"><span class="ml">Poznámka</span><span class="mv" id="mNote"></span></div>
    <div class="mr"><span class="ml">Frekvencia</span><span class="mv" id="mFreq"></span></div>
    <div class="mr"><span class="ml">Obdobie</span><span class="mv" id="mRange"></span></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
